name: Test specific version install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-ko
        uses: .
        with:
          version: v0.15.2
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Assert ko is installed
        run: |
          echo "Checking ko is available in PATH..."
          if ! command -v ko > /dev/null 2>&1; then
            echo "FAIL: ko not found in PATH"
            exit 1
          fi
          echo "PASS: ko is installed"
          ko version
      - name: Assert ko version matches expected
        run: |
          KO_VER=$(ko version 2>&1 || true)
          echo "ko version output: ${KO_VER}"
          if ! echo "${KO_VER}" | grep -q "0.15.2"; then
            echo "FAIL: expected ko version 0.15.2 but got: ${KO_VER}"
            exit 1
          fi
          echo "PASS: ko version is 0.15.2"
