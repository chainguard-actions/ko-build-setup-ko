name: Test specific version install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-ko
        uses: .
        with:
          version: v0.15.0
      - name: Assert ko is installed at the correct version
        run: |
          echo "Checking ko is on PATH..."
          if ! command -v ko > /dev/null 2>&1; then
            echo "FAIL: ko not found on PATH"
            exit 1
          fi
          KO_VER=$(ko version 2>&1 || true)
          echo "ko version output: ${KO_VER}"
          if echo "${KO_VER}" | grep -q "0.15.0"; then
            echo "PASS: ko v0.15.0 is installed"
          else
            echo "FAIL: expected ko v0.15.0 but got: ${KO_VER}"
            exit 1
          fi
      - name: Assert KO_DOCKER_REPO is set
        run: |
          echo "KO_DOCKER_REPO=${KO_DOCKER_REPO}"
          if [ -z "${KO_DOCKER_REPO}" ]; then
            echo "FAIL: KO_DOCKER_REPO is not set"
            exit 1
          fi
          if [[ "${KO_DOCKER_REPO}" != ghcr.io/* ]]; then
            echo "FAIL: KO_DOCKER_REPO does not start with ghcr.io/"
            exit 1
          fi
          echo "PASS: KO_DOCKER_REPO=${KO_DOCKER_REPO}"
