name: Test setup-ko specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: v0.15.2
      - name: Assert ko is installed at the correct version
        run: |
          echo "Checking ko binary..."
          if ! command -v ko &>/dev/null; then
            echo "FAIL: ko binary not found in PATH"
            exit 1
          fi
          KO_VERSION=$(ko version 2>&1 || true)
          echo "ko version output: $KO_VERSION"
          if echo "$KO_VERSION" | grep -q "0.15.2"; then
            echo "PASS: ko v0.15.2 is installed"
          else
            echo "FAIL: expected ko v0.15.2 but got: $KO_VERSION"
            exit 1
          fi
      - name: Assert KO_DOCKER_REPO is set
        env:
          KO_DOCKER_REPO: ${{ env.KO_DOCKER_REPO }}
        run: |
          echo "KO_DOCKER_REPO: $KO_DOCKER_REPO"
          if [ -z "$KO_DOCKER_REPO" ]; then
            echo "FAIL: KO_DOCKER_REPO is not set"
            exit 1
          fi
          if [[ "$KO_DOCKER_REPO" != ghcr.io/* ]]; then
            echo "FAIL: KO_DOCKER_REPO does not start with ghcr.io/"
            exit 1
          fi
          echo "PASS: KO_DOCKER_REPO=$KO_DOCKER_REPO"
