name: Test custom KO_DOCKER_REPO (pre-set)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      KO_DOCKER_REPO: my-custom-registry.example.com/myorg
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-ko
        uses: .
        with:
          version: v0.15.0
      - name: Assert ko is installed
        run: |
          echo "Checking ko is on PATH..."
          if ! command -v ko > /dev/null 2>&1; then
            echo "FAIL: ko not found on PATH"
            exit 1
          fi
          echo "ko version: $(ko version)"
          echo "PASS: ko is installed"
      - name: Assert KO_DOCKER_REPO is preserved
        run: |
          echo "KO_DOCKER_REPO=${KO_DOCKER_REPO}"
          if [ "${KO_DOCKER_REPO}" != "my-custom-registry.example.com/myorg" ]; then
            echo "FAIL: KO_DOCKER_REPO was overwritten, expected 'my-custom-registry.example.com/myorg' but got '${KO_DOCKER_REPO}'"
            exit 1
          fi
          echo "PASS: KO_DOCKER_REPO preserved as ${KO_DOCKER_REPO}"
