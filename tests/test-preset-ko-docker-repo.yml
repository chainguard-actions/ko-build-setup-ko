name: Test pre-set KO_DOCKER_REPO skips login
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      KO_DOCKER_REPO: registry.example.com/myorg/myrepo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup-ko
        uses: .
        with:
          version: v0.15.2

      - name: Assert ko is installed
        run: |
          echo "Checking ko binary..."
          if ! command -v ko > /dev/null 2>&1; then
            echo "FAIL: ko binary not found in PATH"
            exit 1
          fi
          echo "PASS: ko binary found"

      - name: Assert KO_DOCKER_REPO is preserved
        run: |
          echo "KO_DOCKER_REPO: $KO_DOCKER_REPO"
          if [ "$KO_DOCKER_REPO" != "registry.example.com/myorg/myrepo" ]; then
            echo "FAIL: expected KO_DOCKER_REPO to be 'registry.example.com/myorg/myrepo', got: $KO_DOCKER_REPO"
            exit 1
          fi
          echo "PASS: KO_DOCKER_REPO preserved as expected"
